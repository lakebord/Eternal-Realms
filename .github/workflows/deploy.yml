# Publishes Eternal Realms Online (the game/ folder) and its Android app to Cloudflare Pages.
# main = the live site, next = the test site (next.<project>.pages.dev).
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Account → Cloudflare Pages → Edit) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main, next]
  workflow_dispatch:
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build the Android app (APK)
        continue-on-error: true   # the website still goes out if the app build breaks
        env:
          SITE_URL: ${{ github.ref_name == 'main' && 'https://eternal-realms-26r.pages.dev' || 'https://next.eternal-realms-26r.pages.dev' }}
          APP_ID: ${{ github.ref_name == 'main' && 'com.eternalrealms.game' || 'com.eternalrealms.game.test' }}
          APP_NAME: ${{ github.ref_name == 'main' && 'Eternal Realms' || 'Eternal Realms (test)' }}
          OUT_DIR: game
          VERSION_CODE: ${{ github.run_number }}
        run: bash tools/build-apk.sh
      - name: Check the Cloudflare secrets are set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Create the Pages project (first run only)
        run: npx --yes wrangler@3.99.0 pages project create eternal-realms --production-branch main || echo "Project already exists"
      - name: Publish
        run: npx --yes wrangler@3.99.0 pages deploy game --project-name eternal-realms --branch ${{ github.ref_name }} --commit-dirty=true
