# Publishes the 3D prototype (proto3d/) to its own Cloudflare Pages project, separate from the main game.
# Uses the same repository secrets as the main deploy: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Deploy 3D prototype
on:
  push:
    branches: [proto-3d]
  workflow_dispatch:
concurrency:
  group: deploy-3d
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare the site folder
        run: rm -rf proto3d/tools
      - name: Create the Pages project (first run only)
        run: npx --yes wrangler@3.99.0 pages project create eternal-realms-3d --production-branch proto-3d || echo "Project already exists"
      - name: Publish
        run: npx --yes wrangler@3.99.0 pages deploy proto3d --project-name eternal-realms-3d --branch proto-3d --commit-dirty=true
      # Eternal Realms Online (2.5D) — its own site. Shares three.js and the soundtrack with the 3D prototype.
      - name: Prepare Eternal Realms Online
        run: |
          rm -rf proto25d/vendor proto25d/assets/music proto25d/tools proto25d/test.html
          cp -r proto3d/vendor proto25d/vendor
          mkdir -p proto25d/assets/music
          cp proto3d/assets/music/mus_wild.mp3 proto3d/assets/music/mus_boss.mp3 proto3d/assets/music/mus_title.mp3 assets/mus_town.mp3 proto25d/assets/music/
      - name: Create the Online project (first run only)
        run: npx --yes wrangler@3.99.0 pages project create eternal-realms-online --production-branch proto-3d || echo "Project already exists"
      - name: Publish Eternal Realms Online
        run: npx --yes wrangler@3.99.0 pages deploy proto25d --project-name eternal-realms-online --branch proto-3d --commit-dirty=true
