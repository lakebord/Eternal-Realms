<title>Eternal Realms</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#11141b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Eternal Realms: a living fantasy text MMORPG with hundreds of autonomous adventurers, guilds, chat and tactical combat.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a night-lit adventurer's ledger. Ink-dark slate, gilt for what matters, verdigris for the living world.
   Place names set in small-caps engraving type; chat and numbers in a mono log. Phone: bottom tab bar. Desktop: chat column. */
:root{
  --bg:#0f1219; --bg2:#151923; --panel:#1a1f2b; --panel2:#212837; --panel3:#283044; --line:#2c3446; --line2:#3a4459;
  --ink:#ece6d6; --ink2:#aaa596; --ink3:#77735f;
  --gilt:#e0b45e; --gilt2:#a9823a; --verd:#5cb8a8; --blood:#df5d47; --mana:#5e8fe6; --stam:#82b95a; --xp:#b98be6;
  --r0:#cfcabb; --r1:#6ccb6f; --r2:#5ea2f5; --r3:#c47df2; --r4:#f4a144;
  --track:#0a0c11; --shadow:0 1px 0 #ffffff08 inset, 0 8px 24px -12px #000c;
  --display:'IM Fell English SC','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --body:'Alegreya Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --rad:10px; --rad-s:7px; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eceae4; --bg2:#e2dfd7; --panel:#f8f6f1; --panel2:#efece4; --panel3:#e5e1d6; --line:#d5d0c3; --line2:#bfb8a7;
  --ink:#1f2230; --ink2:#535767; --ink3:#878a96; --gilt:#93670f; --gilt2:#7a5612; --verd:#1f7a6c; --blood:#b33a25; --mana:#2c5fc0; --stam:#4a8a26; --xp:#7a4fb0;
  --r0:#555a66; --r1:#2a8a2e; --r2:#2462c4; --r3:#8a3cc2; --r4:#b8620c; --track:#3b4150; --shadow:0 1px 2px #0000000f, 0 8px 24px -14px #0004; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eceae4; --bg2:#e2dfd7; --panel:#f8f6f1; --panel2:#efece4; --panel3:#e5e1d6; --line:#d5d0c3; --line2:#bfb8a7;
  --ink:#1f2230; --ink2:#535767; --ink3:#878a96; --gilt:#93670f; --gilt2:#7a5612; --verd:#1f7a6c; --blood:#b33a25; --mana:#2c5fc0; --stam:#4a8a26; --xp:#7a4fb0;
  --r0:#555a66; --r1:#2a8a2e; --r2:#2462c4; --r3:#8a3cc2; --r4:#b8620c; --track:#3b4150; --shadow:0 1px 2px #0000000f, 0 8px 24px -14px #0004; color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));min-height:100vh;
  background-image:radial-gradient(ellipse 80% 40% at 50% -5%,color-mix(in srgb,var(--gilt) 9%,transparent),transparent 70%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg2)}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.02em;text-wrap:balance;margin:.15em 0 .4em;line-height:1.15}
h1{font-size:clamp(2.4rem,8vw,4.6rem)} h2{font-size:1.5rem;color:var(--gilt)} h3{font-size:1.14rem;display:flex;align-items:center;gap:.4em;flex-wrap:wrap}
h2 small,h3 small{font-family:var(--body);font-size:.8rem;color:var(--ink3);letter-spacing:0}
p{margin:.35em 0} small{color:var(--ink2)} a{color:var(--verd);cursor:pointer}
.hint{color:var(--ink3);font-size:.88rem}.tiny{font-size:.75rem}.good{color:var(--stam)}.bad{color:var(--blood)}.lore{color:var(--verd);font-style:italic}
.r0{color:var(--r0)}.r1{color:var(--r1)}.r2{color:var(--r2)}.r3{color:var(--r3)}.r4{color:var(--r4);font-weight:700;text-shadow:0 0 10px color-mix(in srgb,var(--r4) 40%,transparent)}
.lv-red{color:var(--blood)}.lv-orange{color:#e8873a}.lv-yellow{color:var(--gilt)}.lv-green{color:var(--stam)}.lv-grey{color:var(--ink3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--gilt);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:var(--rad-s);padding:.5em .7em;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gilt2);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--gilt) 18%,transparent)}
textarea{width:100%;font-family:var(--mono);font-size:.8rem}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
/* buttons */
.b{font:inherit;font-weight:500;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:var(--rad-s);padding:.55em .85em;cursor:pointer;line-height:1.2;text-align:left;transition:background .15s,border-color .15s,transform .08s}
.b:hover{border-color:var(--gilt2);background:var(--panel3)}.b:active{transform:translateY(1px)}
.b.gilt{background:linear-gradient(180deg,color-mix(in srgb,var(--gilt) 30%,var(--panel2)),color-mix(in srgb,var(--gilt) 10%,var(--panel2)));border-color:var(--gilt2)}
.b.danger{border-color:color-mix(in srgb,var(--blood) 60%,var(--line));background:color-mix(in srgb,var(--blood) 15%,var(--panel2))}
.b.ghost{background:transparent}.b.tiny{font-size:.8rem;padding:.32em .6em}.b.big{font-size:1.1rem;padding:.85em 1.1em;width:100%}
.b.big small{display:block;font-weight:400}.b small{display:block;color:var(--ink2);font-size:.75rem}.b.dim,.b:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:.5em;align-items:center;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:.6em}
.grid-btn{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.45em}
.grid-act{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.5em}
.ab{font:inherit;display:flex;align-items:center;gap:.7em;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:var(--rad);padding:.6em .75em;color:var(--ink);cursor:pointer;min-width:0;transition:border-color .15s,background .15s,transform .08s}
.ab:hover{border-color:var(--gilt2);background:var(--panel3)}.ab:active{transform:translateY(1px)}
.ab .ic{width:2.1em;height:2.1em;padding:.4em;border-radius:8px;background:color-mix(in srgb,var(--gilt) 12%,var(--bg2));color:var(--gilt)}
.ab b{display:block;font-weight:600;line-height:1.2}.ab small{display:block;font-size:.76rem;color:var(--ink3)}.ab span{min-width:0}
.ab.danger .ic{background:color-mix(in srgb,var(--blood) 18%,var(--bg2));color:var(--blood)}.ab.gilt{border-color:var(--gilt2)}.ab.gilt .ic{background:var(--gilt);color:var(--bg)}
.ab em{font-style:normal;background:var(--blood);color:#fff;border-radius:9px;font-size:.68rem;padding:0 .4em;margin-left:.3em}
/* title */
#app{position:relative}
.titlebg{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
.title{max-width:480px;margin:9vh auto 4vh;text-align:center;padding-block:2em;position:relative}
.title h1{color:var(--gilt);text-shadow:0 2px 30px color-mix(in srgb,var(--gilt) 40%,transparent);margin:.1em 0}
.title .tag{color:#c9c2ae;font-size:1.1rem;margin-bottom:2em}.title .col{text-align:left}.title .hint{color:#8f8a78}
.title .b{backdrop-filter:blur(6px);background:color-mix(in srgb,#151923 75%,transparent);color:#ece6d6;border-color:#3a4459}.title .b.gilt{background:linear-gradient(180deg,#5a4a2a,#2a2620);border-color:#a9823a}
.title .b small{color:#b6b0a0}
.crest{width:84px;height:84px;margin:0 auto 1em;display:grid;place-items:center;border:1.5px solid #a9823a;border-radius:50%;color:#e0b45e;box-shadow:0 0 0 6px #0f121999,0 0 0 7px #a9823a,0 0 40px #e0b45e4d}
.crest .ic{width:40px;height:40px;stroke-width:1.3}
/* game layout */
#game{max-width:1440px;margin:0 auto}
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.5em 1.1em;align-items:center;padding:.5em .7em;margin:0 -12px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.hname{display:flex;align-items:center;gap:.6em;min-width:0}.hname>div{display:flex;flex-direction:column;min-width:0}
.pname{font:inherit;font-family:var(--display);font-size:1.18rem;color:var(--gilt);background:none;border:0;padding:0;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hname small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.8rem}
.portrait{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--ac) 45%,var(--panel2)),var(--bg2));border:2px solid var(--ac);color:var(--ink);cursor:pointer;flex:none;padding:0}
.portrait .ic{width:22px;height:22px}.portrait b{position:absolute;bottom:-5px;right:-6px;font-family:var(--mono);font-size:.66rem;background:var(--gilt);color:var(--bg);border-radius:8px;padding:0 .35em;line-height:1.5}
.portrait.lg{width:64px;height:64px}.portrait.lg .ic{width:32px;height:32px}
.hbars{display:grid;grid-template-columns:repeat(4,1fr);gap:.35em;min-width:0}
.hmeta{display:flex;gap:.8em;align-items:center;font-size:.82rem;color:var(--ink2);flex-wrap:wrap;justify-content:flex-end;font-variant-numeric:tabular-nums}
.hmeta>span{display:inline-flex;align-items:center;gap:.3em;white-space:nowrap}
.gold{color:var(--gilt);font-family:var(--mono);font-size:.85em;white-space:nowrap}
.net{font:inherit;font-family:var(--mono);font-size:.74rem;display:inline-flex;align-items:center;gap:.3em;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:.2em .6em;color:var(--ink3);cursor:pointer}
.net.online{color:var(--stam);border-color:color-mix(in srgb,var(--stam) 40%,var(--line))}
.bar{position:relative;display:flex;align-items:center;height:18px;background:var(--track);border:1px solid var(--line);border-radius:5px;overflow:hidden;min-width:0}
.bar i{position:absolute;inset:0 auto 0 0;transition:width .4s cubic-bezier(.2,.8,.2,1);box-shadow:inset 0 1px 0 #ffffff30}
.bar span{position:relative;z-index:2;font-family:var(--mono);font-size:.68rem;line-height:1;padding-left:6px;white-space:nowrap;color:#f6f2e6;text-shadow:0 1px 2px #000c}
.bar.hp i{background:linear-gradient(180deg,#e2705a,#a8382a)}.bar.mp i{background:linear-gradient(180deg,#76a2f0,#3a62b8)}
.bar.sp i{background:linear-gradient(180deg,#9ccc72,#527e30)}.bar.xp i{background:linear-gradient(180deg,#cba0f0,#7a4ab8)}
.bar.thin{height:4px;border:0;margin-top:4px}
#nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:.35em 0;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr-h,64px));z-index:19;background:var(--bg);border-bottom:1px solid var(--line)}
#nav::-webkit-scrollbar{display:none}
.tab{font:inherit;font-size:.92rem;display:inline-flex;align-items:center;gap:.4em;background:transparent;color:var(--ink2);border:0;border-radius:var(--rad-s);padding:.45em .75em;cursor:pointer;white-space:nowrap;position:relative}
.tab:hover{color:var(--ink);background:var(--panel)}.tab.on{color:var(--gilt);background:color-mix(in srgb,var(--gilt) 10%,transparent)}
.tab em,.ct em,.bt em{font-style:normal;background:var(--blood);color:#fff;border-radius:9px;font-size:.66rem;padding:0 .4em;line-height:1.5}
#bnav,#ticker{display:none}
#main{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:1.1em;align-items:start;padding-block:.8em 3em}
#view{min-width:0;display:flex;flex-direction:column;gap:.85em}
#side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr-h,64px) + 52px);min-width:0}
@media (max-width:999px){
  #main{grid-template-columns:minmax(0,1fr);padding-bottom:calc(140px + env(safe-area-inset-bottom,0px))}#side{display:none}#hdr{grid-template-columns:minmax(0,1fr) auto}.hbars{grid-column:1/-1;grid-row:2}
  #nav{display:none}
  #bnav{display:grid;grid-template-columns:repeat(7,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--bg2) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding:.3em max(6px,env(safe-area-inset-right,0px)) calc(.3em + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .bt{font:inherit;font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--ink3);padding:.35em 0;cursor:pointer;position:relative;border-radius:8px}
  .bt .ic{width:24px;height:24px}.bt.on{color:var(--gilt)}.bt.on .ic{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--gilt) 50%,transparent))}
  .bt em{position:absolute;top:0;left:55%}
  #ticker:not([hidden]){display:block;position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:24;padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px))}
  #ticker button{font:inherit;width:100%;display:flex;align-items:center;gap:.5em;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:20px;padding:.3em .7em .3em .35em;color:var(--ink2);font-size:.8rem;cursor:pointer;text-align:left}
  #ticker .av{width:22px;height:22px;font-size:.7rem}#ticker span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}#ticker b{color:var(--ink)}
  #toasts{bottom:calc(110px + env(safe-area-inset-bottom,0px))!important}
}
@media (max-width:520px){.hbars{grid-template-columns:repeat(2,1fr)}.hmeta .loc,.hmeta .clock{display:none}.grid-act{grid-template-columns:1fr 1fr}.ab{padding:.5em .55em;gap:.5em}.ab .ic{width:1.9em;height:1.9em}.ab b{font-size:.92rem}}
/* panels */
.panel,.locard{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:.9em 1.05em;min-width:0;box-shadow:var(--shadow)}
.panel>h3:first-child{margin-top:0}
.locard{position:relative;overflow:hidden;padding:0;border-color:color-mix(in srgb,var(--gilt) 28%,var(--line))}
.vista{height:clamp(130px,26vw,230px);background-size:cover;background-position:center;position:relative}
.vista::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,var(--panel))}
.vista.sm{height:110px;border-radius:var(--rad-s);margin:-.2em 0 .6em}.panel.hero .vista.sm{margin:-.9em -1.05em .2em;border-radius:var(--rad) var(--rad) 0 0;height:120px}
.locard .lochead,.locard .desc,.locard .weather{padding:0 1.05em}.locard .lochead{margin-top:-2.6em;position:relative}.locard .weather{padding-bottom:.9em;font-size:.86rem;color:var(--ink3);font-style:italic}
.lochead{display:flex;justify-content:space-between;gap:.5em;flex-wrap:wrap;align-items:flex-end}.lochead h2{font-size:clamp(1.7rem,5vw,2.3rem);margin:0;text-shadow:0 2px 12px var(--panel),0 0 2px var(--panel)}
.desc{color:var(--ink2);max-width:68ch}
.chips{display:flex;gap:.3em;flex-wrap:wrap}.chip{font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--line2);border-radius:20px;padding:.18em .6em;color:var(--ink2);background:color-mix(in srgb,var(--panel) 80%,transparent)}
.chip.danger{border-color:var(--blood);color:var(--blood)}
.panel.boss{border-color:var(--blood);background:linear-gradient(180deg,color-mix(in srgb,var(--blood) 12%,var(--panel)),var(--panel))}.panel.dungeon{border-color:var(--gilt2)}
.notice{background:color-mix(in srgb,var(--verd) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--verd) 40%,var(--line));border-radius:var(--rad);padding:.55em .85em}
.freeform{margin-top:.9em}.freeform label{display:block;font-size:.85rem;color:var(--ink2);margin-bottom:.25em}.freeform input{flex:1}
.travel,.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.45em}
.tr,.person{font:inherit;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:var(--rad);padding:.55em .7em;color:var(--ink);cursor:pointer;min-width:0;display:flex;align-items:center;gap:.6em;transition:border-color .15s,background .15s}
.tr{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:.6em}.tr .compass{grid-row:1/3;color:var(--gilt)}.tr .compass .ic{width:1.6em;height:1.6em}
.tr:hover,.person:hover{border-color:var(--gilt2);background:var(--panel3)}.tr b,.person b{display:block;font-weight:600}.tr small,.person small{display:block;font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person>span{min-width:0}.person.real{border-color:color-mix(in srgb,var(--verd) 55%,var(--line));background:color-mix(in srgb,var(--verd) 7%,var(--panel2))}
.av{width:30px;height:30px;flex:none;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--display);font-size:.95rem;color:#fff;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--ac) 85%,#fff),color-mix(in srgb,var(--ac) 70%,#000));box-shadow:0 0 0 1.5px color-mix(in srgb,var(--ac) 60%,var(--bg))}
.av.real{box-shadow:0 0 0 2px var(--verd)}
sup,.realdot{color:var(--verd);font-size:.6em}
.log{max-height:360px;overflow-y:auto;font-size:.9rem;display:flex;flex-direction:column;gap:.1em}
.log p{margin:0;padding:.22em 0;border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent)}.log time{font-family:var(--mono);font-size:.66rem;color:var(--ink3);margin-right:.5em}
.log .good{color:var(--stam)}.log .bad{color:var(--blood)}.log .epic{color:var(--gilt);font-weight:600}.log .lore{color:var(--verd)}.log .social{color:var(--r2)}.log .me{color:var(--ink2);font-style:italic}.log .head{color:var(--gilt)}
.n-war{color:var(--blood)}.n-boss{color:#e8873a}.n-fame{color:var(--gilt)}
.list{display:flex;flex-direction:column;gap:3px}
.li{display:flex;gap:.6em;align-items:center;justify-content:space-between;padding:.5em .65em;border-radius:var(--rad-s);background:var(--panel2);flex-wrap:wrap}
.li>span:first-child{flex:1 1 220px;min-width:0}.li small{font-size:.8rem}.li.dim{opacity:.55}.li.q b{font-weight:600}
.itm{font:inherit;background:none;border:0;color:inherit;padding:0;text-align:left;cursor:pointer}
details summary{cursor:pointer;color:var(--ink2);padding:.35em 0}details[open] summary{color:var(--gilt)}
.legend{font-size:.78rem;color:var(--ink3);display:flex;gap:.9em;flex-wrap:wrap;align-items:center}.lg{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid;margin-right:-.6em}
.lg.city{border-color:var(--gilt)}.lg.dng{border-color:var(--blood)}.lg.ruin{border-color:var(--verd)}.lg.fr{background:var(--verd);border-color:var(--verd)}
.phead{display:flex;align-items:center;gap:.8em}.phead .av{width:48px;height:48px;font-size:1.4rem}.phead h2{margin:0}
.coop{border:1px solid color-mix(in srgb,var(--verd) 50%,var(--line));border-radius:var(--rad);padding:.6em .8em;background:color-mix(in srgb,var(--verd) 7%,var(--panel))}.coop.active{border-color:var(--verd)}.coop.invited{border-color:var(--gilt)}
.coop h3{color:var(--verd);margin:0 0 .2em}
/* character */

/* ---------------- LORE / CODEX ---------------- */
const LORE = {
  lore_sundering:{t:'The Sundering',cat:'History',x:'Twelve centuries ago the Aethermoor Empire tried to light a second sun, the Sun-Engine at the top of the Spire. It broke. The sky tore open over the eastern wastes, the continents cracked, and the empire fell in one night. Every kingdom alive today was built on what was left.'},
  lore_aethermoor:{t:'The Aethermoor Empire',cat:'History',x:'For a thousand years the Aethermoor Emperors ruled every continent with mage-engines and dragon-pacts. Elves were its scholars, beastkin its slave-legions, and humans its tax-farmers. Its last Emperor, Solenhal, is said to have walked into the Sun-Engine as it broke.'},
  lore_unchaining:{t:'The Unchaining',cat:'History',x:'As the empire fell, the beastkin slave-legions broke their collars and turned on their masters. Their general, Grey-Fang, led them to the Feral Coast. Every beastkin child learns the Chain-Breaker\'s song.'},
  lore_dragonpacts:{t:'The Dragon-Pacts',cat:'Myth',x:'Aethermoor\'s archmagi bound dragons with oaths written in blood. When the empire fell the oaths broke, and the dragons remember. Pyrrhax the Red was a pact-dragon, and draconians are said to descend from those bonds.'},
  lore_vel:{t:'Archmage Vel',cat:'Legend',x:'Court Archmage Vel foresaw the Sundering and saved himself instead of the empire. He bound his soul to a phylactery and now rules the Necropolis. Every few years his armies of dead march again.'},
  lore_lionheart:{t:'Aldric Lionheart',cat:'Legend',x:'A farmer\'s son from the Greenmarch who united the human refugee-bands and drove the goblin hordes out. He founded Valeria. He is buried somewhere under the Lion Cathedral with his sword, Dawnbreaker, which has never been found.'},
  lore_undervault:{t:'The Fall of Undervault',cat:'History',x:'Three hundred years ago the dwarves of Undervault dug for mithril and broke into an Aethermoor vault full of sleeping constructs. The hold fell in a single night. The Stone Ledger still records the debt as "owed by the deep."'},
  lore_concord:{t:'The Sylvan Concord',cat:'Politics',x:'The High Elves and the Wood Elves split over whether magic or nature should come first. The Concord binds them together, but the two councils rarely agree.'},
  lore_spideroracle:{t:'The Spider Oracle',cat:'Religion',x:'The dark elves worship a giant spider that sees the threads of fate. Her priestesses speak in riddles, and the Nine Houses treat her riddles as law.'},
  lore_dawnmother:{t:'The Dawnmother',cat:'Religion',x:'The human goddess of light, healing and the harvest. The Church of the First Light teaches that she kindled the true sun, and that Aethermoor\'s false sun was blasphemy.'},
  lore_ashspirits:{t:'The Ash Spirits',cat:'Religion',x:'Orcs believe their ancestors live in the ash of the Burned Plain. In the Rite of Ash, a would-be Warchief walks into the volcanic plains and comes back changed, or doesn\'t come back.'},
  lore_saltmere:{t:'The Seven Purses',cat:'Politics',x:'Seven merchant houses own Saltmere. Their founders were Aethermoor tax-collectors who sailed away with the imperial treasury. The Doge is elected, though the votes are bought openly.'},
  lore_spire:{t:'The Shattered Spire',cat:'Mystery',x:'The Spire still floats above the eastern wastes. Its sun-engine core pulses once every hundred years. Scholars argue about whether it is dying or waking up.'},
  lore_grubnak:{t:'Goblin Warlords',cat:'Bestiary',x:'Goblins breed fast and fight dirty, but alone they are cowards. A Warlord unites tribes by cunning and terror. When one appears, every village nearby is in danger.'},
  lore_wyrm:{t:'Hjalvar the Frost Wyrm',cat:'Bestiary',x:'An old white dragon who sleeps on Frostpeak Summit. The dwarves pay him a tribute of silver every winter, which some call cowardice and others call good sense.'},
  lore_hydra:{t:'The Mire Hydra',cat:'Bestiary',x:'Cut off one head and two grow back unless the stump is burned. The beastkin call it "Many-Mouths" and offer it no tribute.'},
  lore_hollow:{t:'The Hidden Archives',cat:'Mystery',x:'The Archmagi of Aethermoor hid their last research in a vale that does not appear on any map. People say you find it by following the whispers west of Moonfall Glade.'},
  lore_monastery:{t:'The Way of the Open Sky',cat:'Mystery',x:'Monks who believe the elements can be balanced inside the body. Their monastery is somewhere above Khazgard, past the end of the dwarf roads.'},
  lore_cove:{t:'Silk-Eye\'s Pirates',cat:'Rumor',x:'The Saltmere navy has hunted Captain Silk-Eye for twenty years. Sailors say his cove is three hours south-west of the harbor, behind a waterfall.'},
  lore_fragment:{t:'An Aethermoor Fragment',cat:'Mystery',x:'A shard of glowing crystal with a voice inside it: "...the engine was not broken. It was SILENCED. The key lies in..." The rest is lost.'},
  lore_classes:{t:'On the Higher Paths',cat:'Guide',x:'Masters in the great cities train exceptional adventurers in advanced disciplines. Each one demands experience, skill mastery and a trial. Some paths, like the Spellblade and the Weaponmaster, are open to any class that earns them.'},
  lore_guilds:{t:'Adventurer Guilds',cat:'Guide',x:'Since the Sundering, adventurer guilds have done the work kingdoms can\'t afford: hunting monsters, clearing dungeons, guarding caravans. The strongest guilds are now as powerful as nobles.'}
};

    const g=U.wpick(opts,g=>1+ (g.goal==='pvp'?n.tr.compet:0)+(g.goal==='wealth'?n.tr.greed:0)+(g.goal==='raid'?n.tr.brave:0)+(g.goal==='social'?n.tr.social:0));joinGuild(n,g,true);}
  for(const g of S.guilds){const ms=g.members.map(npc).filter(m=>m.id!==g.leader).sort((a,b)=>b.level-a.level);g.officers=ms.slice(0,Math.min(3,Math.ceil(ms.length/8))).map(m=>m.id);for(const o of g.officers)npc(o).grank='Officer';
    g.xp=g.members.length*U.ri(200,800);g.lvl=guildLevel(g.xp);g.rep=Math.round(guildPower(g)/10);}
  for(let i=0;i<8;i++){const a=U.pick(S.guilds),b=U.pick(S.guilds);if(a!==b&&!a.rivals.includes(b.id)){a.rivals.push(b.id);b.rivals.push(a.id);}}
  for(let i=0;i<5;i++){const a=U.pick(S.guilds),b=U.pick(S.guilds);if(a!==b&&!a.rivals.includes(b.id)&&!a.allies.includes(b.id)){a.allies.push(b.id);b.allies.push(a.id);}}
}
function guildLevel(xp){return Math.min(30,1+Math.floor(Math.sqrt(xp/400)));}
function guildPower(g){let p=0;for(const id of g.members){const m=id==='P'?S.P:npc(id);if(m&&!m.retired)p+=stats(m).power;}return Math.round(p);}
function joinGuild(n,g,silent){if(n.guild)leaveGuild(n,true);n.guild=g.id;n.grank='Member';if(!g.members.includes(n.id))g.members.push(n.id);if(!silent){hist(n,`Joined ${g.name}`);BUS.emit('guild_join',{n,g});}}
function leaveGuild(n,silent){const g=guild(n.guild);if(!g)return;g.members=g.members.filter(x=>x!==n.id);g.officers=g.officers.filter(x=>x!==n.id);n.guild=null;n.grank=null;
  if(!silent){hist(n,`Left ${g.name}`);BUS.emit('guild_leave',{n,g});}
  if(g.leader===n.id){const next=g.officers[0]||g.members.find(x=>x!=='P');if(next&&next!=='P'){g.leader=next;npc(next).grank='Leader';g.officers=g.officers.filter(x=>x!==next);news(`${actorName(next)} is now the leader of ${g.name}.`,'guild');}
    else if(!g.members.length){S.guilds=S.guilds.filter(x=>x!==g);news(`${g.name} has disbanded.`,'guild');}}}

/* ---------------- GOALS ---------------- */
function pickGoal(n){
  const t=n.tr;const opts=[
    [{type:'level',target:Math.min(100,n.level+U.ri(2,6))},0.6+t.ambit],
    [{type:'gear'},0.4+t.greed*0.4+(gearScore(n.equip)<n.level*7?1:0)],
    [{type:'wealth',target:Math.round((n.gold+200)*U.rf(1.5,3))},t.greed*1.4],
    [{type:'pvp',target:n.pvp.r+U.ri(50,150)},t.compet*1.3],
    [{type:'boss'},t.brave*(n.level>=30?1:0.1)],
    [{type:'explore'},t.explore*0.9],
    [{type:'dungeon'},0.3+t.brave*0.5],
    [{type:'craft'},['smithing','alchemy','cooking','enchanting'].includes(n.prof)?0.6:0.05]];
  return U.wpick(opts,o=>o[1])[0];
}
function goalMet(n){const g=n.goal;if(!g)return true;
  if(g.type==='level')return n.level>=g.target;if(g.type==='wealth')return n.gold>=g.target;if(g.type==='pvp')return n.pvp.r>=g.target;
  if(g.type==='gear')return gearScore(n.equip)>=n.level*8.5;if(g.type==='boss')return g.done;if(g.type==='explore')return g.done;if(g.type==='dungeon')return g.done;if(g.type==='craft')return g.done;return false;}

/* ---------------- ONLINE SCHEDULE ---------------- */
function online(n,t=S.time){if(n.retired)return false;const h=T.hour(t);const s=n.sched.start,e=(s+n.sched.len)%24;return s<e?(h>=s&&h<e):(h>=s||h<e);}

/* ---------------- COMBAT ABSTRACTION FOR SIM ---------------- */
function kConst(l){return 50+l*8;}
function estDmg(st,lvl,tgt){ // average dmg per action vs a target {pdef,mdef,eva}
  const K=kConst(lvl);const ph=st.patk*K/(K+tgt.pdef*(1-(st.pen||0))),mg=st.matk*1.15*K/(K+tgt.mdef);
  const hit=U.clamp((st.acc-tgt.eva)/100,0.3,0.97);return Math.max(ph,mg)*hit*(1+st.crit/100*0.5)*1.25;}
function winChance(n,m,pack=1){
  const st=stats(n);const role=CLASSES[n.cls].role;
  const myD=estDmg(st,n.level,m)*(role==='summoner'?1.25:1);
  const K=kConst(m.level);const monD=Math.max(m.atk*K/(K+st.pdef),m.matk*K/(K+st.mdef)*0.9)*U.clamp((m.acc-st.eva)/100,0.3,0.97);
  const hp=st.mhp*n.hpPct*(role==='healer'?1.35:1)*(role==='tank'?1.2:1);
  const tKill=m.mhp*pack/myD,tDie=hp/(monD*(1+(pack-1)*0.8));
  return U.sig(2.2*Math.log(tDie/tKill)+0.4);
}
function duelChance(a,b){const sa=stats(a),sb=stats(b);
  const da=estDmg(sa,a.level,{pdef:sb.pdef,mdef:sb.mdef,eva:sb.eva}),db=estDmg(sb,b.level,{pdef:sa.pdef,mdef:sa.mdef,eva:sa.eva});
  return U.sig(2.0*Math.log((sa.mhp/db)/(sb.mhp/da)));}

/* ---------------- NPC PROGRESSION ---------------- */
function npcGainXp(n,x){
  if(n.level>=LEVEL_CAP)return;n.xp+=Math.round(x*NPC_XP_RATE*(n.level<20?1:n.level<50?0.8:n.level<80?0.6:0.4));
  while(n.level<LEVEL_CAP&&n.xp>=xpNext(n.level)){n.xp-=xpNext(n.level);n.level++;
    const g=classGrowth(n),prio=CLASS_PRIO[n.cls];for(const k in g)n.attr[k]+=Math.round(g[k]);for(let p=0;p<2;p++)n.attr[U.chance(0.6)?prio[0]:U.chance(0.6)?prio[1]:prio[2]]++;
    dirty(n);n.fame+=n.level;
    if(n.level%5===0||n.level>=50){hist(n,`Reached level ${n.level}`);BUS.emit('levelup',{n});}
    for(const [lv,a] of [[10,'lv10'],[25,'lv25'],[50,'lv50'],[75,'lv75'],[100,'lv100']])if(n.level>=lv&&!n.ach.includes(a)){n.ach.push(a);if(lv>=50)news(`${n.user} reached level ${lv}!`,'fame');}
    if(n.level>=LEVEL_CAP){news(`${n.user} has reached the level cap: Lv.100!`,'fame');BUS.emit('cap',{n});}
    checkNpcAdvance(n);
  }
}
function npcMastery(n,k,amt){k=mKey(k);const v=(n.mastery[k]||0);if(v>=100)return;if(U.chance(amt/(4+v*0.25)))n.mastery[k]=v+1;}
function checkNpcAdvance(n){
  if(n.adv)return;for(const id in ADV_CLASSES){const A=ADV_CLASSES[id];if(advEligible(n,A).ok&&U.chance(0.3)){n.adv=id;dirty(n);hist(n,`Became a ${A.name}`);n.ach.push('advclass');news(`${n.user} has become a ${A.name}!`,'fame');BUS.emit('advance',{n,A});return;}}
}
function advEligible(a,A){
  const why=[];
  if(A.from&&!A.from.includes(a.cls))why.push(`Class must be ${A.from.map(c=>CLASSES[c].name).join('/')}`);
  if(a.level<A.lvl)why.push(`Level ${A.lvl}`);
  for(const k in A.req||{})if(mLv(a,k)<A.req[k])why.push(`${MASTERY[k].n} ${A.req[k]}`);
  if(A.reqAny&&A.reqAny.schools&&!SCHOOL_M.some(s=>mLv(a,s)>=A.reqAny.schools))why.push(`Any magic school ${A.reqAny.schools}`);
  if(A.reqAnySchool&&!SCHOOL_M.some(s=>mLv(a,s)>=A.reqAnySchool))why.push(`Any magic school ${A.reqAnySchool}`);
  if(A.reqAnyWeapon&&!WEAPON_M.some(s=>mLv(a,s)>=A.reqAnyWeapon))why.push(`Any weapon mastery ${A.reqAnyWeapon}`);
  if(A.weaponCount&&WEAPON_M.filter(s=>mLv(a,s)>=30).length<A.weaponCount)why.push(`${A.weaponCount} weapon masteries at 30`);
  if(A.flag&&!((a.flags||{})[A.flag]))why.push('Slay a dragon world boss');
  if(A.comps&&(a.comps?a.comps.length:(a.level>45?3:0))<A.comps)why.push(`${A.comps} bonded companions`);
  if(A.tamed&&(a.comps?a.comps.length:(a.level>35?2:0))<A.tamed)why.push(`${A.tamed} tamed creatures`);
  return {ok:!why.length,why};
}
function npcDie(n,cause){n.deaths++;n.hpPct=0.3;n.conf=U.clamp(n.conf-0.08,0,1);const lost=Math.round(n.gold*0.05);n.gold-=lost;
  const town=nearestTown(n.loc);n.loc=town;n.path=[];n.busy=S.time+U.ri(30,90);n.act='recovering';hist(n,`Was defeated ${cause}`);BUS.emit('npc_death',{n,cause});}
function nearestTown(loc){if(isTown(loc)&&!LOCS[loc].hid)return loc;let best=null,bd=1e9;for(const l in LOCS){if(!isTown(l)||LOCS[l].hid)continue;const p=path(loc,l,true);if(p&&p.hours<bd){bd=p.hours;best=l;}}return best||'crossroads';}
function bestHuntLoc(n){const L=n.level;const c=Object.keys(LOCS).filter(l=>{const x=LOCS[l];return !isTown(l)&&x.mon.length&&(!x.hid||n.knows.includes(l))&&x.lv[0]<=L+2&&x.lv[1]>=L-6&&(!x.pvp||n.tr.brave>0.5);});
  if(!c.length){const all=Object.keys(LOCS).filter(l=>!isTown(l)&&LOCS[l].mon.length&&!LOCS[l].hid).sort((a,b)=>Math.abs(LOCS[a].lv[1]-L)-Math.abs(LOCS[b].lv[1]-L));return all[0];}
  return U.wpick(c,l=>1+(n.loc===l?2:0)+(n.knows.includes(l)?1:0));}

/* ---------------- NPC ACTIONS ---------------- */
function startTravel(n,dest,why){if(n.loc===dest)return false;const p=path(n.loc,dest,true);if(!p)return false;n.path=p.path.slice(1);n.dest=dest;n.act='travel';n.why=why;stepTravel(n);return true;}
function stepTravel(n){const next=n.path.shift();if(!next){n.dest=null;n.act='idle';return;}const h=GRAPH[n.loc][next]||2;n.busy=S.time+h*60;n.pendingLoc=next;}
function arrive(n){if(n.pendingLoc){const from=n.loc;n.loc=n.pendingLoc;n.pendingLoc=null;if(!n.knows.includes(n.loc)){n.knows.push(n.loc);if(LOCS[n.loc].hid){hist(n,`Discovered ${LOCS[n.loc].n}`);BUS.emit('discover',{n,loc:n.loc});}}
    if(!n.path.length){n.dest=null;n.act='idle';}}}
function npcHunt(n,hours){
  const loc=n.loc,L=LOCS[loc];if(!L.mon.length)return;
  let fights=U.ri(2,4)*hours,xp=0,gold=0,won=0,items=[];n.act='hunting';
  for(let i=0;i<fights;i++){const id=U.pick(L.mon),lv=locMonsterLevel(loc),M=MONSTERS[id];const m=makeMonster(id,lv);const pack=(M.b||[]).includes('pack')?U.ri(1,3):1;
    const p=winChance(n,m,pack);
    if(U.chance(p)){won++;xp+=monXp(lv,M)*pack*(RACES[n.race].xp||1);const lt=rollLoot(id,lv,n.attr.luck);gold+=lt.gold;items.push(...lt.items);n.kills+=pack;n.hpPct=U.clamp(n.hpPct-U.rf(0.02,0.25)*(1-p),0.05,1);
      npcMastery(n,stats(n).wt,2);for(const k in CLASSES[n.cls].mastery)if(MASTERY[mKey(k)].t==='school')npcMastery(n,k,1.5);}
    else{n.hpPct-=U.rf(0.3,0.7);if(n.hpPct<=0.05){if(U.chance(0.5+n.tr.caution*0.4)){n.hpPct=0.15;n.act='fleeing';break;}npcDie(n,`by a ${M.n} in ${L.n}`);return;}}
    if(n.hpPct<0.25&&n.tr.caution>0.3)break;}
  npcGainXp(n,xp);n.gold+=gold;n.conf=U.clamp(n.conf+won*0.002,0,1);
  for(const it of items){if(isGear(it)){if(npcConsiderEquip(n,it))continue;n.inv.push(it);if(it.r>=3){hist(n,`Found ${itemName(it)} in ${L.n}`);BUS.emit('loot',{n,it,loc});}}else{const e=n.inv.find(x=>x.k===it.k);if(e)e.q+=it.q;else n.inv.push({k:it.k,q:it.q});}}
  if(n.inv.length>12)n.inv.splice(0,n.inv.length-12);
  n.busy=S.time+hours*60;
}
function npcConsiderEquip(n,it){const base=ITEM_BASES[it.b];if(!base)return false;const sl=base.sl;if(it.l>n.level+5)return false;const C=CLASSES[n.cls];
  if(base.t==='weapon'&&!C.weapons.includes(base.wt))return false;if(base.t==='armor'&&base.ac!==C.armor)return false;if(base.t==='weapon'&&base.two&&n.equip.offhand){}
  const cur=n.equip[sl];const sc=x=>x?x.l*RARITY[x.r].m:0;if(sc(it)>sc(cur)*1.05){if(cur)n.inv.push(cur);n.equip[sl]=it;if(base.two&&n.equip.offhand){n.inv.push(n.equip.offhand);n.equip.offhand=null;}dirty(n);return true;}return false;}
function npcShop(n){ // buy an upgrade from the smith in town
  const city=n.loc;if(!hasSvc(city,'smith'))return false;const C=CLASSES[n.cls];
  const slots=['weapon','chest','legs','head','hands','feet','offhand','ring','amulet'];
  const sc=x=>x?x.l*RARITY[x.r].m:0;let worst=null,ws=1e9;for(const sl of slots){if(sl==='offhand'&&n.equip.weapon&&ITEM_BASES[n.equip.weapon.b].two)continue;const s=sc(n.equip[sl]);if(s<ws){ws=s;worst=sl;}}
  if(!worst)return false;
  const lv=Math.min(n.level+2,100),r=n.gold>itemValue({b:'sword',l:lv,r:2})*1.5&&U.chance(0.4)?2:U.chance(0.6)?1:0;
  let base=worst==='weapon'?U.pick(C.weapons.filter(w=>ITEM_BASES[w])):worst==='offhand'?'shield':(worst==='ring'||worst==='amulet')?worst:`${worst}_${C.armor}`;
  const it=makeGear(base,lv,r);const price=Math.round(itemValue(it)*priceMult(city,ITEM_BASES[base].t==='weapon'?'weapon':'armor')*1.2);
  if(price>n.gold*0.7||sc(it)<=ws)return false;
  n.gold-=price;const cur=n.equip[worst];if(cur)n.inv.push(cur);n.equip[worst]=it;dirty(n);demand(city,ITEM_BASES[base].t==='weapon'?'weapon':'armor',1);
  hist(n,`Bought ${itemName(it)} for ${U.fmt(price)}g`);BUS.emit('buy',{n,it,price,city});n.busy=S.time+30;n.act='shopping';
  if(n.goal&&n.goal.type==='gear'&&goalMet(n))BUS.emit('goal_done',{n,goal:n.goal});
  return true;
}
function npcSell(n){ // vendor junk & list valuables on the market
  const city=n.loc;if(!isTown(city))return;let earned=0;
  n.inv=n.inv.filter(it=>{
    if(isGear(it)){if(it.r>=2&&(hasSvc(city,'market'))&&S.market.length<140&&(n.tr.greed>0.35||it.r>=3)){listItem(n,it,Math.round(itemValue(it)*U.rf(1.0,1.6)*(1+n.tr.greed*0.5)));return false;}
      const v=Math.round(itemValue(it)*0.35*priceMult(city,'weapon'));earned+=v;supply(city,'weapon',0.5);return false;}
    const d=ITEMS[it.k];if(d&&d.t==='mat'&&!(['smithing','alchemy','cooking','enchanting'].includes(n.prof)&&U.chance(0.5))){earned+=Math.round(d.v*it.q*0.6*priceMult(city,'mat'));supply(city,'mat',it.q*0.2);return false;}
    return true;});
  n.gold+=earned;if(earned>0){n.act='trading';n.busy=S.time+20;}
}
function npcListLoot(n,init){const lv=Math.max(1,n.level+U.ri(-5,3));const it=randomGear(lv,null,U.chance(0.15)?3:U.chance(0.5)?2:1);listItem(n,it,Math.round(itemValue(it)*U.rf(1.0,1.7)),init);}
function listItem(n,it,price,silent){const L={id:U.uid(),item:it,price:Math.max(5,price),seller:n.id,t:S.time};S.market.push(L);n.listed++;if(!silent&&(it.r>=2||U.chance(0.3)))BUS.emit('wts',{n,L});return L;}
function npcBuyMarket(n){ // buy listings that are upgrades
  if(!S.market.length)return false;const sc=x=>x?x.l*RARITY[x.r].m:0;const C=CLASSES[n.cls];
  for(const L of U.shuffle(S.market.slice()).slice(0,12)){const it=L.item;if(!isGear(it)||L.seller===n.id)continue;const b=ITEM_BASES[it.b];if(it.l>n.level+5)continue;
    if(b.t==='weapon'&&!C.weapons.includes(b.wt))continue;if(b.t==='armor'&&b.ac!==C.armor)continue;
    const cur=n.equip[b.sl];if(sc(it)<=sc(cur)*1.1)continue;const fair=itemValue(it)*(1.6-n.tr.greed*0.5);if(L.price>fair||L.price>n.gold*0.8)continue;
    buyListing(n,L);return true;}
  return false;
}
function buyListing(buyer,L){const i=S.market.indexOf(L);if(i<0)return false;S.market.splice(i,1);
  const isP=buyer==='P'||buyer===S.P;const b=isP?S.P:buyer;b.gold-=L.price;
  const tax=Math.round(L.price*0.05);
  if(L.seller==='P'){S.P.gold+=L.price-tax;S.P.stats.sold=(S.P.stats.sold||0)+1;BUS.emit('player_sold',{L,buyer:b});}
  else if(L.seller&&L.seller.startsWith&&L.seller.startsWith('n')){const s=npc(L.seller);if(s){s.gold+=L.price-tax;if(L.price>500)hist(s,`Sold ${itemName(L.item)} for ${U.fmt(L.price)}g`);
    if(isP)remember(s,`Bought my ${itemName(L.item)} for ${U.fmt(L.price)}g`,4);}}
  if(isP){invAdd(S.P,L.item.b!=null?L.item:L.item.k,L.item.q||1);}else{npcConsiderEquip(b,L.item)||b.inv.push(L.item);hist(b,`Bought ${itemName(L.item)} at auction`);}
  return true;}
function npcCraft(n){const R=RECIPES.filter(r=>r.m===n.prof&&(n.mastery[n.prof]||0)>=r.lv&&!r.ench);if(!R.length)return false;
  const r=U.pick(R.slice(-4));n.mastery[n.prof]=Math.min(100,(n.mastery[n.prof]||0)+(U.chance(0.3)?1:0));n.crafted++;
  let it;if(r.gear){it=makeGear(randomGearBase(r.gear),r.ilvl+U.ri(-2,3),U.chance(0.08+(n.mastery[n.prof]||0)/400)?2:U.chance(0.5)?1:0);it.crafter=n.user;}else it={k:r.out,q:U.ri(1,3)};
  const cost=Object.entries(r.in).reduce((s,[k,q])=>s+ITEMS[k].v*q,0);n.gold-=Math.min(n.gold,Math.round(cost*0.7));
  if(hasSvc(n.loc,'market')&&S.market.length<140)listItem(n,it,Math.round((isGear(it)?itemValue(it):ITEMS[it.k].v*it.q)*U.rf(1.1,1.5)));else n.gold+=Math.round((isGear(it)?itemValue(it):ITEMS[it.k].v*it.q)*0.8);
  if(n.goal&&n.goal.type==='craft'&&n.crafted%5===0)n.goal.done=true;
  n.act='crafting';n.busy=S.time+U.ri(60,120);return true;}

/* dungeon expeditions: forms a real party of NPCs */
function npcDungeon(leader){
  const dungeons=Object.keys(LOCS).filter(l=>LOCS[l].boss&&LOCS[l].lv[0]<=leader.level+3&&LOCS[l].lv[1]>=leader.level-8);if(!dungeons.length)return false;
  const d=dungeons.includes(leader.loc)?leader.loc:U.pick(dungeons);
  const pool=(S.byLoc[leader.loc]||[]).filter(o=>o!==leader&&!o.retired&&o.busy<=S.time&&online(o)&&Math.abs(o.level-leader.level)<=8&&!o.inParty);
  const party=[leader];const need=['tank','healer','dps'];
  for(const role of need){const c=pool.filter(o=>!party.includes(o)&&CLASSES[o.cls].role===role).sort((a,b)=>(leader.friends.includes(b.id)?1:0)-(leader.friends.includes(a.id)?1:0)+(b.guild===leader.guild?1:0)-(a.guild===leader.guild?1:0));if(c[0])party.push(c[0]);}
  if(party.length<3){if(U.chance(0.12))BUS.emit('lfg',{n:leader,loc:d,need:need.filter(r=>!party.some(p=>CLASSES[p.cls].role===r))});return false;}
  // resolve expedition
  const D=LOCS[d],floors=D.floors||3;let alive=party.slice(),xp=0,loot=[],gold=0;
  for(let f=0;f<floors&&alive.length;f++){const id=U.pick(D.mon),lv=U.ri(D.lv[0],D.lv[1])+f;const m=makeMonster(id,lv);
    const avg=alive.reduce((s,p)=>s+winChance(p,m,1),0)/alive.length;const pw=U.clamp(avg+alive.length*0.06,0,0.995);
    if(U.chance(pw)){xp+=monXp(lv,MONSTERS[id])*3;const lt=rollLoot(id,lv,10,2);gold+=lt.gold;loot.push(...lt.items);}else{const v=U.pick(alive);v.hpPct=0.1;alive=alive.filter(x=>x!==v);npcDie(v,`in ${D.n}`);}}
  let cleared=false;
  if(alive.length){const bl=D.lv[1]+2;const bm=makeMonster(D.boss,bl);const avg=alive.reduce((s,p)=>s+winChance(p,bm,1),0)/alive.length;const pw=U.clamp(avg*0.9+alive.length*0.08,0,0.97);
    if(U.chance(pw)){cleared=true;xp+=monXp(bl,MONSTERS[D.boss]);const lt=rollLoot(D.boss,bl,15,3);gold+=lt.gold;loot.push(...lt.items);}
    else{for(const p of alive)if(U.chance(0.5))npcDie(p,`by ${MONSTERS[D.boss].n}`);}}
  for(const p of party){if(p.loc!==d&&p.act!=='recovering')p.loc=p.act==='recovering'?p.loc:d;npcGainXp(p,xp/party.length*1.2);p.gold+=Math.round(gold/party.length);if(cleared){p.dung++;p.boss++;p.fame+=Math.round(D.lv[1]*1.5);if(p.goal&&p.goal.type==='dungeon')p.goal.done=true;}
    if(p.act!=='recovering'){p.busy=S.time+U.ri(150,240);p.act='dungeon';}
    for(const o of party)if(o!==p&&!p.friends.includes(o.id)&&U.chance(cleared?0.25:0.08)){p.friends.push(o.id);}}
  // loot distribution: need-based round robin
  let i=0;for(const it of loot){const cand=party.filter(p=>p.act!=='recovering'||true);const p=cand[i++%cand.length];if(isGear(it)){if(!npcConsiderEquip(p,it))p.inv.push(it);if(it.r>=3||it.u){hist(p,`Looted ${itemName(it)} from ${D.n}`);BUS.emit('loot',{n:p,it,loc:d});}}else{const e=p.inv.find(x=>x.k===it.k);if(e)e.q+=it.q;else p.inv.push({k:it.k,q:it.q});}}
  for(const p of party)if(p.inv.length>12)p.inv.splice(0,p.inv.length-12);
  BUS.emit('dungeon',{party,loc:d,cleared});
  if(cleared){for(const p of party)hist(p,`Cleared ${D.n} with ${party.filter(x=>x!==p).map(x=>x.user).join(', ')}`);if(D.lv[0]>=38)news(`${party.map(p=>p.user).join(', ')} cleared ${D.n}!`,'dungeon');}
  return true;
}
function npcDuel(n){
  const city=n.loc;if(!hasSvc(city,'arena'))return false;
  const opp=(S.byLoc[city]||[]).filter(o=>o!==n&&online(o)&&o.busy<=S.time&&Math.abs(o.pvp.r-n.pvp.r)<250&&!o.retired);if(!opp.length)return false;
  const o=n.rivals.map(npc).find(r=>opp.includes(r))||U.pick(opp);
  const p=duelChance(n,o);const win=U.chance(p);const [w,l]=win?[n,o]:[o,n];eloUpdate(w,l);
  w.pvp.w++;l.pvp.l++;w.fame+=5;n.busy=S.time+30;o.busy=S.time+30;n.act=o.act='dueling';
  if(l.tr.arrog>0.6&&!l.rivals.includes(w.id)&&U.chance(0.5)){l.rivals.push(w.id);hist(l,`Swore revenge on ${w.user}`);}
  if(n.goal&&n.goal.type==='pvp'&&goalMet(n))BUS.emit('goal_done',{n,goal:n.goal});
  BUS.emit('duel',{w,l,city,upset:(win?p:1-p)<0.3});return true;
}
function eloUpdate(w,l,k=32){const rw=w.pvp.r,rl=l.pvp.r;const ew=1/(1+Math.pow(10,(rl-rw)/400));w.pvp.r=Math.round(rw+k*(1-ew));l.pvp.r=Math.round(rl-k*(1-ew));}

function npcAct(n){
  if(n.inParty)return;
  if(typeof npcEventAct==='function'&&npcEventAct(n))return;
  if(n.pendingLoc&&n.busy<=S.time)arrive(n);
  if(n.busy>S.time||!online(n))return;
  if(n.path.length){stepTravel(n);return;}
  if(goalMet(n)){const old=n.goal;if(old){hist(n,`Achieved goal: ${goalText(old)}`);BUS.emit('goal_done',{n,goal:old});}n.goal=pickGoal(n);}
  // passive recovery
  if(isTown(n.loc))n.hpPct=U.clamp(n.hpPct+0.4,0,1);else n.hpPct=U.clamp(n.hpPct+0.08,0,1);
  const t=n.tr,g=n.goal||{},inTown=isTown(n.loc);const L=LOCS[n.loc];
  const gsLag=gearScore(n.equip)<n.level*7.5;
  const opts=[];
  opts.push(['rest',(n.hpPct<0.5?3:0)+t.lazy*0.6]);
  opts.push(['hunt',0.9+t.ambit*0.5+(g.type==='level'?0.8:0)+(g.type==='wealth'?0.4:0)-(n.hpPct<0.5?1:0)]);
  opts.push(['shop',inTown&&n.gold>n.level*40&&gsLag?1.8+t.greed*0.3:0.05]);
  opts.push(['market',inTown&&hasSvc(n.loc,'market')&&n.gold>n.level*30?0.35+(g.type==='gear'?0.6:0):0]);
  opts.push(['sell',inTown&&n.inv.length>=5?1.5:0]);
  opts.push(['craft',['smithing','alchemy','cooking','enchanting'].includes(n.prof)&&inTown&&n.gold>40?0.3+(g.type==='craft'?1.2:0):0]);
  opts.push(['dungeon',n.level>=5&&n.hpPct>0.7?0.35+t.brave*0.4+(g.type==='dungeon'?1.0:0)+(g.type==='gear'?0.3:0)+t.social*0.2:0]);
  opts.push(['duel',hasSvc(n.loc,'arena')?t.compet*0.8+(g.type==='pvp'?1.2:0):(g.type==='pvp'?0.6:0)]);
  opts.push(['boss',S.boss&&n.level>=S.boss.lvl-22&&n.hpPct>0.6?0.6+t.brave*0.8+(g.type==='boss'?1.5:0)+(n.guild?0.3:0):0]);
  opts.push(['explore',t.explore*0.5+(g.type==='explore'?1.2:0)]);
  opts.push(['social',inTown?t.social*0.5+t.lazy*0.3:0]);
  opts.push(['war',S.wars.length&&n.level>=15&&t.brave>0.6?0.15:0]);
  const choice=U.wpick(opts,o=>o[1])||['rest'];
  switch(choice[0]){
    case 'rest':if(!inTown){startTravel(n,nearestTown(n.loc),'rest');return;}n.hpPct=1;n.act='resting';n.busy=S.time+U.ri(30,120);break;
    case 'hunt':{if(L.mon.length&&L.lv[0]<=n.level+2&&L.lv[1]>=n.level-6){npcHunt(n,U.ri(1,3));}else{const b=bestHuntLoc(n);if(b&&b!==n.loc)startTravel(n,b,'hunt');else if(L.mon.length)npcHunt(n,1);}break;}
    case 'shop':if(!npcShop(n)){if(!hasSvc(n.loc,'smith'))startTravel(n,nearestTown(n.loc),'shop');else{n.busy=S.time+30;n.act='browsing';}}break;
    case 'market':if(!npcBuyMarket(n)){n.busy=S.time+20;n.act='browsing';}break;
    case 'sell':npcSell(n);break;
    case 'craft':if(!npcCraft(n)){n.busy=S.time+30;}break;
    case 'dungeon':if(!npcDungeon(n)){n.busy=S.time+30;n.act='looking for group';}break;
    case 'duel':if(!hasSvc(n.loc,'arena')){startTravel(n,U.pick(['valeria','crossroads','bloodrock','khazgard','saltmere','duskhaven']),'arena');}else if(!npcDuel(n)){n.busy=S.time+30;n.act='waiting at arena';}break;
    case 'boss':if(S.boss){if(n.loc!==S.boss.loc)startTravel(n,S.boss.loc,'boss');else raidBoss([n]);}break;
    case 'explore':{const unk=Object.keys(LOCS).filter(l=>!n.knows.includes(l)&&(!LOCS[l].hid||U.chance(0.02))&&LOCS[l].lv[0]<=n.level+5);if(unk.length){const d=U.pick(unk);if(!startTravel(n,d,'explore'))n.busy=S.time+60;}else{if(g.type==='explore')g.done=true;n.busy=S.time+60;}break;}
    case 'social':n.act='chatting';n.busy=S.time+U.ri(20,60);BUS.emit('social',{n});break;
    case 'war':{const w=U.pick(S.wars);n.act='at war';n.busy=S.time+180;S.kd[w.a].army+=0.3;hist(n,`Fought for ${FACTIONS[w.a].n} in the war`);break;}
  }
  // career change / retirement (rare, driven by history)
  if(n.deaths>8+n.level/4&&n.conf<0.2&&U.chance(0.03)){
    if(n.level>40&&U.chance(0.4)){n.retired=true;hist(n,'Retired from adventuring');news(`${n.user} has retired from adventuring after ${n.deaths} defeats.`,'fame');BUS.emit('retire',{n});if(n.guild)leaveGuild(n);}
    else{const old=n.prof;n.prof=U.pick(['smithing','alchemy','cooking','trading']);n.conf=0.5;n.deaths=0;hist(n,`Gave up front-line fighting to focus on ${MASTERY[n.prof].n}`);BUS.emit('career',{n,old});n.goal={type:'craft'};}}
  if(n.conf>0.85&&n.tr.caution>0.6&&U.chance(0.01)){n.tr.caution-=0.1;n.tr.brave+=0.1;hist(n,'Became more daring');}
}
function goalText(g){return ({level:`reach level ${g.target}`,gear:'upgrade equipment',wealth:`save ${U.fmt(g.target||0)} gold`,pvp:`reach ${g.target} PvP rating`,boss:'kill a world boss',explore:'explore the world',dungeon:'clear a dungeon',craft:'craft and sell wares'})[g.type]||g.type;}

/* ---------------- WORLD BOSSES ---------------- */
const WORLD_BOSSES=[['b_grubnak','whisperwood',20,3],['b_hydra','mire',45,2],['b_frostwyrm','summit',58,2],['b_dragon','ashen',80,1.2],['b_lich','necropolis',90,1]];
function spawnBoss(){const [id,loc,lvl]=U.wpick(WORLD_BOSSES.concat(WORLD_BOSSES_EXT),b=>b[3]);const m=makeMonster(id,lvl);S.boss={id,loc,lvl,hp:m.mhp,mhp:m.mhp,contrib:{},start:S.time,end:S.time+U.ri(20,36)*60,deaths:0};
  news(`World Boss ${MONSTERS[id].n} has appeared in ${LOCS[loc].n}!`,'boss');BUS.emit('boss_spawn',{boss:S.boss});}
function raidBoss(group){const B=S.boss;if(!B)return;const m=makeMonster(B.id,B.lvl);
  for(const n of group){if(n.busy>S.time&&n.act==='raiding')continue;const st=stats(n);const d=estDmg(st,n.level,m)*U.ri(6,12);B.hp-=d;B.contrib[n.id]=(B.contrib[n.id]||0)+d;n.act='raiding';n.busy=S.time+60;
    const p=winChance(n,m,1);if(U.chance((1-p)*0.35)){B.deaths++;npcDie(n,`by ${MONSTERS[B.id].n}`);}
    if(B.hp<=0){killBoss(n.id);return;}}}
function killBoss(lastHit){const B=S.boss;if(!B)return;const M=MONSTERS[B.id];S.boss=null;S.nextBoss=S.time+U.ri(30,60)*60;
  const ranked=Object.entries(B.contrib).sort((a,b)=>b[1]-a[1]);
  news(`${M.n} has been slain! Final blow: ${actorName(lastHit)}.`,'boss');
  ranked.slice(0,25).forEach(([id,dmg],i)=>{const n=id==='P'?S.P:npc(id);if(!n)return;
    if(id==='P'){BUS.emit('player_boss_reward',{rank:i+1,M,B,lastHit});return;}
    n.boss++;n.fame+=Math.round(B.lvl*(i<3?6:2));npcGainXp(n,monXp(B.lvl,M)/Math.max(4,ranked.length)*2);
    if(i<5){const lt=rollLoot(B.id,B.lvl,20,2);n.gold+=lt.gold;for(const it of lt.items)if(isGear(it)){if(!npcConsiderEquip(n,it))n.inv.push(it);if(it.u||it.r>=3){hist(n,`Looted ${itemName(it)} from ${M.n}`);if(it.u)news(`${n.user} obtained the legendary ${itemName(it)}!`,'fame');}}}
    if(M.cat==='dragon'){n.flags=n.flags||{};n.flags.slew_dragon=1;}
    hist(n,`Helped slay ${M.n}${i===0?' (top damage)':''}`);if(n.goal&&n.goal.type==='boss')n.goal.done=true;});
  BUS.emit('boss_dead',{M,B,lastHit,ranked});}

/* ---------------- ECONOMY ---------------- */
function priceMult(city,cat){const e=S.econ[city];if(!e||!e[cat])return 1;let m=Math.sqrt(e[cat].d/e[cat].s);
  const f=S.control[city];if(f&&S.wars.some(w=>w.a===f||w.b===f)&&(cat==='weapon'||cat==='armor'||cat==='con'))m*=1.15;return U.clamp(m,0.65,1.7);}
function demand(city,cat,q){const e=S.econ[city];if(e&&e[cat])e[cat].d+=q;}
function supply(city,cat,q){const e=S.econ[city];if(e&&e[cat])e[cat].s+=q;}
function econTick(){for(const c in S.econ)for(const k in S.econ[c]){const e=S.econ[c][k];e.s+=(50-e.s)*0.03;e.d+=(50-e.d)*0.03;}
  S.market=S.market.filter(L=>{if(S.time-L.t>4*1440&&L.seller!=='P'){const s=npc(L.seller);if(s&&isGear(L.item)&&s.inv.length<12)s.inv.push(L.item);return false;}return true;});}

/* ---------------- POLITICS ---------------- */
function politicsDay(){
  for(let i=0;i<KINGDOMS.length;i++)for(let j=i+1;j<KINGDOMS.length;j++){const a=KINGDOMS[i],b=KINGDOMS[j];let r=rel(a,b);
    const atWar=S.wars.find(w=>(w.a===a&&w.b===b)||(w.a===b&&w.b===a));r+=U.ri(-4,4)+(atWar?-1:0)+(r>50?1:0);
    for(const w of S.wars){if(w.a!==a&&w.a!==b&&w.b!==a&&w.b!==b){if((w.a===a||w.b===a)&&(w.a===b||w.b===b))continue;}}
    setRel(a,b,r);
    if(!atWar&&r<-62&&U.chance(0.18)&&S.wars.length<2){const contested=CONTESTED.filter(l=>S.control[l]===a||S.control[l]===b||S.control[l]==='free');
      const w={a,b,start:S.time,score:0,front:U.pick(contested.length?contested:CONTESTED),days:0};S.wars.push(w);
      news(`WAR! ${FACTIONS[a].n} has declared war on ${FACTIONS[b].n}! Fighting breaks out at ${LOCS[w.front].n}.`,'war');BUS.emit('war',{w});}
    if(!atWar&&r>70&&U.chance(0.05)&&!S.flags['ally_'+relKey(a,b)]){S.flags['ally_'+relKey(a,b)]=1;news(`${FACTIONS[a].n} and ${FACTIONS[b].n} sign a treaty of friendship.`,'politics');BUS.emit('treaty',{a,b});}}
  for(const w of S.wars.slice()){w.days++;const A=S.kd[w.a],B=S.kd[w.b];const pa=A.army*U.rf(0.7,1.3),pb=B.army*U.rf(0.7,1.3);
    if(pa>pb){w.score++;B.army-=U.ri(2,8);A.army-=U.ri(0,4);}else{w.score--;A.army-=U.ri(2,8);B.army-=U.ri(0,4);}
    if(Math.abs(w.score)>=3&&S.control[w.front]!==(w.score>0?w.a:w.b)&&U.chance(0.5)){const winner=w.score>0?w.a:w.b;const old=S.control[w.front];S.control[w.front]=winner;
      news(`${FACTIONS[winner].n} has seized ${LOCS[w.front].n}${old?` from ${FACTIONS[old].n}`:''}!`,'war');BUS.emit('conquest',{w,winner,loc:w.front});}
    A.weary+=1;B.weary+=1;
    if((w.days>4&&U.chance(0.12+w.days*0.02))||A.army<40||B.army<40){S.wars=S.wars.filter(x=>x!==w);setRel(w.a,w.b,rel(w.a,w.b)+35);A.weary=0;B.weary=0;
      news(`Peace is declared between ${FACTIONS[w.a].n} and ${FACTIONS[w.b].n} after ${w.days} days of war.`,'war');BUS.emit('peace',{w});}}
  for(const k of KINGDOMS){const K=S.kd[k];K.army=U.clamp(K.army+U.ri(1,4),20,160);K.treasury+=U.ri(-300,800);}
}

/* ---------------- GUILD SIM ---------------- */
function guildTick(){
  for(const g of S.guilds.slice()){if(g.isPlayer){playerGuildTick(g);continue;}
    const leader=npc(g.leader);if(!leader||leader.retired){const next=g.officers.map(npc).find(o=>o&&!o.retired)||g.members.map(npc).find(o=>o&&!o.retired);if(next){g.leader=next.id;next.grank='Leader';news(`${next.user} took over leadership of ${g.name}.`,'guild');}else{S.guilds=S.guilds.filter(x=>x!==g);continue;}}
    const L=npc(g.leader);
    // recruit
    if(g.members.length<60&&U.chance(0.5)){const cand=S.npcs.filter(n=>!n.guild&&!n.retired&&online(n)&&n.level>=g.req).slice(0,40);const c=U.pick(cand);
      if(c){if(U.chance(0.25+c.tr.social*0.4+c.tr.loyal*0.2)){joinGuild(c,g);}else if(U.chance(0.3))BUS.emit('recruit_ad',{g,L});}
      else if(U.chance(0.4))BUS.emit('recruit_ad',{g,L});}
    // guild activity → xp & treasury
    const act=g.members.filter(id=>{const m=npc(id);return m&&online(m);}).length;g.xp+=act*U.ri(5,20);g.treasury+=act*U.ri(2,12);const nl=guildLevel(g.xp);if(nl>g.lvl){g.lvl=nl;news(`${g.name} reached guild level ${nl}.`,'guild');BUS.emit('guild_level',{g});}
    // morale & departures
    g.morale=U.clamp(g.morale+U.rf(-0.06,0.06)+(L.tr.kind-0.5)*0.03+(g.rep>200?0.01:0),0.1,1);
    if(g.morale<0.35&&U.chance(0.3)){const m=npc(U.pick(g.members.filter(x=>x!==g.leader)));if(m&&m.tr.loyal<0.6){leaveGuild(m);BUS.emit('guild_quit',{n:m,g});}}
    if(g.morale<0.25&&U.chance(0.1)){const o=g.officers.map(npc).find(o=>o&&o.tr.ambit>0.6);if(o){const old=L;g.leader=o.id;o.grank='Leader';old.grank='Officer';g.officers=g.officers.filter(x=>x!==o.id);g.officers.push(old.id);g.morale=0.6;
      hist(old,`Lost control of ${g.name} to ${o.user}`);hist(o,`Seized leadership of ${g.name}`);news(`Coup in ${g.name}! ${o.user} has overthrown ${old.user}.`,'guild');BUS.emit('coup',{g,o,old});}}
    // guild vs guild
    if(g.rivals.length&&U.chance(0.06)){const r=guild(U.pick(g.rivals));if(r){const pa=guildPower(g)*U.rf(0.7,1.3),pb=guildPower(r)*U.rf(0.7,1.3);const [w,l]=pa>pb?[g,r]:[r,g];w.rep+=20;l.rep=Math.max(0,l.rep-10);w.morale+=0.05;l.morale-=0.05;
      news(`Guild war: ${w.name} defeated ${l.name} in a battle near ${LOCS[w.hq].n}.`,'guild');BUS.emit('gvg',{w,l});}}
    if(U.chance(0.01)&&g.allies.length<3){const o=U.pick(S.guilds);if(o!==g&&!g.rivals.includes(o.id)&&!g.allies.includes(o.id)){g.allies.push(o.id);o.allies.push(g.id);news(`${g.name} and ${o.name} formed an alliance.`,'guild');}}
    if(g.treasury>15000&&U.chance(0.05)){g.treasury-=10000;g.hall=(g.hall||0)+1;news(`${g.name} expanded their guild hall in ${LOCS[g.hq].n}.`,'guild');}
    if(U.chance(0.1))BUS.emit('guild_chatter',{g});
  }
}
function playerGuildTick(g){
  g.xp+=g.members.length*U.ri(3,10);g.lvl=guildLevel(g.xp);
  for(const id of g.members.slice()){if(id==='P')continue;const m=npc(id);if(!m||m.retired){g.members=g.members.filter(x=>x!==id);continue;}
    const aff=(m.mem.P||{}).aff||0;g.treasury+=online(m)?U.ri(1,6):0;
    const happy=0.5+aff/200+(g.morale-0.5)+(m.tr.loyal-0.5)*0.4;
    if(happy<0.25&&U.chance(0.15)){leaveGuild(m);remember(m,`Left ${g.name} because I was unhappy`,-5);BUS.emit('pguild_quit',{n:m,g});}
    else if(U.chance(0.04))BUS.emit('pguild_suggest',{n:m,g});}
  g.morale=U.clamp(g.morale+U.rf(-0.03,0.02),0.1,1);
}

/* ---------------- TOURNAMENT ---------------- */
function tourneyTick(){
  const T_=S.tourney;
  if(T_.state==='idle'&&S.time>=T_.next-12*60){T_.state='reg';T_.entrants=[];T_.log=[];news(`Registration for the Grand Tournament in Valeria is open! It starts at ${T.str(T_.next)}.`,'arena');BUS.emit('tourney_reg',{});}
  if(T_.state==='reg'&&S.time>=T_.next){
    const cands=S.npcs.filter(n=>!n.retired&&n.level>=20).sort((a,b)=>b.pvp.r-a.pvp.r).slice(0,40);const ent=U.shuffle(cands).slice(0,T_.reg?15:16).map(n=>n.id);if(T_.reg)ent.push('P');
    T_.entrants=U.shuffle(ent);T_.alive=T_.entrants.slice();T_.round=1;T_.state='running';T_.pending=null;news(`The Grand Tournament has begun! 16 champions compete.`,'arena');BUS.emit('tourney_start',{});runTourneyRound();}
  else if(T_.state==='running'&&T_.pending&&S.time>T_.pending.deadline){T_.log.push(`${S.P.user} forfeited against ${actorName(T_.pending.opp)}.`);T_.alive=T_.alive.filter(x=>x!=='P');T_.pending=null;T_.next2=true;runTourneyRound(true);}
}
function runTourneyRound(cont){
  const T_=S.tourney;if(T_.pending)return;
  if(!cont||!T_.cur){T_.cur=[];for(let i=0;i<T_.alive.length;i+=2)T_.cur.push([T_.alive[i],T_.alive[i+1]]);T_.winners=[];}
  while(T_.cur.length){const [a,b]=T_.cur[0];
    if(!b){T_.winners.push(a);T_.cur.shift();continue;}
    if(a==='P'||b==='P'){T_.pending={opp:a==='P'?b:a,deadline:S.time+4*60,round:T_.round};BUS.emit('tourney_player',{opp:T_.pending.opp,round:T_.round});return;}

function pl(n){return /[^aeiou]y$/i.test(n)?n.slice(0,-1)+'ies':/f$/.test(n)?n.slice(0,-1)+'ves':/(s|x|ch|sh)$/.test(n)?n+'es':n+'s';}
function genQuests(town){
  const nearby=Object.keys(LOCS).filter(l=>{const p=path(town,l);return p&&p.hours<=9&&!isTown(l)&&LOCS[l].mon.length&&!LOCS[l].hid;});
  const q=[];const n=U.ri(4,6);
  for(let i=0;i<n;i++){const loc=U.pick(nearby.length?nearby:['greenmarch']);const L=LOCS[loc];const lvl=Math.round((L.lv[0]+L.lv[1])/2);
    if(U.chance(0.22)&&typeof npcRequest==='function'){const rq=npcRequest(town);if(rq){q.push(rq);continue;}}
    const type=U.wpick(['kill','gather','bounty','explore','deliver','dungeon','escort'],t=>({kill:4,gather:2.5,bounty:1,explore:1,deliver:1,dungeon:L.boss?1.5:0,escort:1})[t]);
    const base={id:U.uid(),type,loc,lvl,giver:town,prog:0};
    if(type==='kill'){const m=U.pick(L.mon);Object.assign(base,{mon:m,qty:U.ri(3,8),n:`Cull the ${pl(MONSTERS[m].n)}`,d:`${pl(MONSTERS[m].n)} have been sighted in ${L.n}. Slay ${'{qty}'} of them.`});}
    if(type==='gather'){const r=U.pick(L.res.length?L.res:[['herb_sun','herbalism']]);Object.assign(base,{item:r[0],qty:U.ri(3,6),n:`Gather ${ITEMS[r[0]].n}`,d:`The ${town==='valeria'?'Royal Alchemist':'quartermaster'} needs ${'{qty}'} ${ITEMS[r[0]].n} from ${L.n}.`});}
    if(type==='bounty'){const m=U.pick(L.mon);Object.assign(base,{mon:m,qty:1,elite:1,n:`Bounty: ${MONSTERS[m].n} Alpha`,d:`A huge ${MONSTERS[m].n} is terrorizing travelers in ${L.n}. Bring back proof.`});base.lvl+=3;}
    if(type==='explore'){Object.assign(base,{qty:1,n:`Survey ${L.n}`,d:`Explore ${L.n} and report anything unusual.`});}
    if(type==='deliver'){const dests=Object.keys(LOCS).filter(l=>isTown(l)&&l!==town&&!LOCS[l].hid);const d=U.pick(dests);Object.assign(base,{loc:d,qty:1,n:`Courier to ${LOCS[d].n}`,d:`Deliver a sealed parcel to ${LOCS[d].n}.`});base.lvl=Math.max(1,lvl-3);}
    if(type==='dungeon'){Object.assign(base,{qty:1,n:`Clear ${L.n}`,d:`Defeat ${MONSTERS[L.boss].n} in ${L.n}.`});base.lvl=L.lv[1];}
    if(type==='escort'){const dests=Object.keys(LOCS).filter(l=>isTown(l)&&l!==town&&!LOCS[l].hid&&path(town,l).hours<=8);const d=U.pick(dests);Object.assign(base,{loc:d,qty:1,escort:1,n:`Escort a caravan to ${LOCS[d].n}`,d:`A merchant caravan needs a guard to ${LOCS[d].n}. Bandits will try their luck on the way.`});base.lvl=Math.max(1,lvl);}
    base.d=base.d.replace('{qty}',base.qty);
    const mult={kill:1,gather:0.8,bounty:2,explore:0.6,deliver:0.7,dungeon:4,escort:1.4}[type];
    base.xp=Math.round(monXp(base.lvl)*base.qty*0.6*mult+monXp(base.lvl)*2);base.gold=Math.round((10+base.lvl*base.lvl*0.6)*mult*U.rf(0.8,1.2));
    base.rep={};const f=S.control[town]||LOCS[town].f;if(f)base.rep[f]=Math.round(3*mult);
    if(U.chance(0.25))base.reward=randomGear(base.lvl,null,U.chance(0.3)?2:1);
    q.push(base);}
  return q;
}

function rumors(loc){
  const R=[];
  if(S.boss)R.push(`They say ${MONSTERS[S.boss.id].n} is rampaging in ${LOCS[S.boss.loc].n}. Raiders are gathering.`);
  for(const w of S.wars)R.push(`${FACTIONS[w.a].n} and ${FACTIONS[w.b].n} are at war. The front is at ${LOCS[w.front].n}.`);
  for(const c in S.econ){const m=priceMult(c,'weapon');if(m>1.25)R.push(`Weapons are expensive in ${LOCS[c].n}. Smiths can't keep up.`);if(m<0.8)R.push(`${LOCS[c].n} is flooded with cheap weapons.`);}
  const top=S.npcs.filter(n=>!n.retired).sort((a,b)=>b.level-a.level)[0];R.push(`Everyone's talking about ${top.user}, the strongest adventurer alive at level ${top.level}.`);
  if(S.tourney.state==='reg')R.push('The Grand Tournament is open for registration at the Valeria Arena.');
  if(!S.P.explored.includes('hollow')&&['thornvale','lothirien','moonfall'].includes(loc))R.push('An old warden swears there\'s a vale west of Moonfall Glade where the dead whisper. It isn\'t on any map.');
  if(!S.P.explored.includes('cove')&&['saltmere','aethermoor'].includes(loc))R.push('Sailors say Silk-Eye\'s pirates hide in sea caves south-west of Saltmere.');
  if(!S.P.explored.includes('skyreach')&&['khazgard','frostpeak','deepforge'].includes(loc))R.push('There\'s a monastery above Khazgard, past the end of the dwarf roads. Monks there fly, apparently.');
  const recent=S.news.filter(n=>n[2]==='dungeon'||n[2]==='fame').slice(0,3).map(n=>n[1]);R.push(...recent);
  if(LOCS[loc].lv&&!isTown(loc))R.push(`Watch out in ${LOCS[loc].n}. ${MONSTERS[U.pick(LOCS[loc].mon)].n}s are common here.`);
  return U.shuffle(R).slice(0,3);
}

function populationDay(){const active=S.npcs.filter(n=>!n.retired);

  for(const n of active){if(n.level>=95&&U.chance(0.01)||n.level>=60&&n.deaths>20&&U.chance(0.02)){n.retired=true;hist(n,'Retired from adventuring');news(`${n.user} (Lv.${n.level}) has retired from adventuring.`,'fame');BUS.emit('retire',{n});if(n.guild)leaveGuild(n);}}

  if(d.ret){if(inCombat){log('You cannot read it mid-fight.','bad');return false;}invRemove(P,it.k);P.loc=P.home;P.dungeon=null;log(`The scroll flares, and you are back in ${LOCS[P.home].n}.`,'good');spend(10);return true;}
  if(d.heal)P.hp=Math.min(st.mhp,P.hp+d.heal);if(d.mana)P.mp=Math.min(st.mmp,P.mp+d.mana);if(d.stam)P.sp=Math.min(st.msp,P.sp+d.stam);
  if(d.wellfed){P.fx.wellfed=S.time+180;}if(d.cure&&P.cfx){for(const k of ['poison','burn','bleed'])delete P.cfx[k];}
  invRemove(P,it.k);if(!inCombat)log(`You use ${d.n}.`);return true;}
function sellItem(idx){const P=S.P,it=P.inv[idx];if(!it)return;const q=isGear(it)?1:it.q;const v=priceFor(isGear(it)?it:{k:it.k},P.loc,false)*(isGear(it)?1:1);
  if(isGear(it)){P.inv.splice(idx,1);P.gold+=v;supply(P.loc,ITEM_BASES[it.b].t==='weapon'?'weapon':'armor',1);log(`Sold ${itemName(it)} for ${v}g.`);}
  else{invRemove(P,it.k,1);P.gold+=v;supply(P.loc,'mat',0.3);log(`Sold ${ITEMS[it.k].n} for ${v}g.`);}

function buyItem(item,price,fromStock){const P=S.P;if(P.gold<price){log('Not enough gold.','bad');return false;}if(P.inv.length>=60){log('Your bags are full.','bad');return false;}
  P.gold-=price;if(isGear(item))P.inv.push(item);else invAdd(P,item.k,1);demand(P.loc,isGear(item)?(ITEM_BASES[item.b].t==='weapon'?'weapon':'armor'):'con',0.5);gainMastery('trading',1);log(`Bought ${itemName(item)} for ${price}g.`);return true;}
/* smith stock per town, refreshed daily */
function smithStock(loc){S.stock=S.stock||{};const day=T.day(S.time);const s=S.stock[loc];if(s&&s.day===day)return s.items;
  const P=S.P;const items=[];const C=CLASSES[P.cls];const tl=LOCS[loc].ty==='city'?P.level:Math.min(P.level,40);
  for(let i=0;i<10;i++){const kind=i<4?'weapon':i<8?'armor':i<9?'offhand':'acc';const base=kind==='weapon'&&i<2?U.pick(C.weapons.filter(w=>ITEM_BASES[w])):randomGearBase(kind,i<6?P.cls:null);
    items.push(makeGear(base,U.clamp(tl+U.ri(-3,3),1,100),U.chance(0.06)?2:U.chance(0.35)?1:0));}
  S.stock[loc]={day,items};return items;}
function shopStock(loc){const L=LOCS[loc];const base=['hpot1','mpot1','stonic','antidote','bread','jerky','scroll_return','smoke'];const lv=S.P.level;
  if(lv>=10||L.ty==='city')base.push('hpot2','mpot2','firebomb','stew');if(lv>=30)base.push('hpot3','mpot3','elixir_str','elixir_def','roast');if(lv>=55)base.push('hpot4','revive');
  if(loc==='lothirien'||loc==='thornvale')base.push('waybread');if(loc==='khazgard'||loc==='deepforge')base.push('stout');return base;}

/* ---------------- travel & exploration ---------------- */
function canEnter(loc){const P=S.P;const f=S.control[loc];if(f&&(P.rep[f]||0)<=-60&&isTown(loc))return [false,`The guards of ${FACTIONS[f].n} will not let you in. (Reputation: ${repTitle(P.rep[f])})`];return [true,''];}
function travelTo(dest,viaService){
  const P=S.P;if(UI.inCombat())return;const hrs=GRAPH[P.loc][dest];if(hrs==null)return;
  const [ok,why]=canEnter(dest);if(!ok){log(why,'bad');return;}
  let h=hrs*evMod('travel');if(P.race==='beastkin'||P.race==='woodelf')h*=0.9;if(viaService==='stable')h*=0.5;
  log(`You set out for ${LOCS[dest].n} (${h.toFixed(1)}h).`);
  const danger=LOCS[dest].mon.length||LOCS[P.loc].mon.length;
  spend(Math.round(h*60));
  const esc=P.quests.find(q=>q.escort&&!q.done);
  if((danger||esc)&&U.chance(viaService?0.05:esc?0.45:0.22)){const pool=LOCS[dest].mon.length?dest:P.loc;log('Ambush on the road!','bad');P.loc=dest;arriveAt(dest,true);startEncounter(pool,{ambush:true});return;}
  P.loc=dest;arriveAt(dest);
}
function arriveAt(loc,quiet){const P=S.P;P.dungeon=null;
  if(!P.explored.includes(loc)){P.explored.push(loc);gainXp(25+LOCS[loc].lv[0]*8);log(`Discovered ${LOCS[loc].n}!`,'good');if(LOCS[loc].hid){P.stats.hidden++;log('This place is not on any map.','epic');}checkAch();}
  if(!quiet)log(`You arrive at ${LOCS[loc].n}. ${T.part(S.time)==='night'?'Night has fallen.':''}`);
  for(const q of P.quests.slice())if((q.type==='deliver'||q.type==='escort')&&q.loc===loc&&!q.done){q.done=true;q.prog=1;completeQuest(q);}
  storyCheck('visit');if(LOCS[loc].hid)storyCheck('discover');
  if(LOCS[loc].pvp&&!quiet)log('⚔ This is an open-world PvP zone. Other adventurers may attack you.','bad');
  BUS.emit('player_arrive',{loc});
}
function exploreHere(){
  const P=S.P,L=LOCS[P.loc];P.stats.explores++;spend(60);
  P.examined[P.loc]=(P.examined[P.loc]||0)+1;
  for(const q of P.quests)if(q.type==='explore'&&q.loc===P.loc&&!q.done){q.prog=1;q.done=true;log(`Quest progress: ${q.n} (complete, return to ${LOCS[q.giver].n})`,'good');}
  if(storyCheck('explore'))return;
  // hidden neighbors
  const hidden=neighbors(P.loc).filter(l=>LOCS[l].hid&&!P.explored.includes(l));
  if(hidden.length&&U.chance(0.18+stats(P).attr.luck*0.004+(P.flags['rumor_'+hidden[0]]?0.3:0))){const h=hidden[0];log(`Following faint signs off the trail, you find a hidden way to ${LOCS[h].n}!`,'epic');P.flags['found_'+h]=1;return;}
  const r=U.r();
  if(L.mon.length&&r<0.42){log('Something stirs nearby...','bad');startEncounter(P.loc);return;}
  if(r<0.55){const g=U.ri(3,10)+L.lv[0]*U.ri(1,4);P.gold+=g;log(`You find a forgotten pouch with ${g} gold.`,'good');return;}
  if(r<0.65&&L.res.length){const [k]=U.pick(L.res);invAdd(P,k,U.ri(1,2));log(`You find some ${ITEMS[k].n}.`,'good');return;}
  if(r<0.78){const here=(S.byLoc[P.loc]||[]).filter(n=>online(n)&&!n.inParty);if(here.length){const n=U.pick(here);log(`You meet ${n.user} (Lv.${n.level} ${CLASSES[n.cls].name}), who is ${n.act}.`,'social');remember(n,`Met in ${L.n}`,1);BUS.emit('player_meet',{n});return;}}
  if(r<0.86&&L.feat){const f=U.pick(L.feat);log(`You come across ${f.toLowerCase().startsWith('a')||f.toLowerCase().startsWith('the')?f.toLowerCase():'a '+f.toLowerCase()}. You can Examine it.`,'lore');return;}
  if(r<0.9&&U.chance(0.4)){const it=randomGear(L.lv[1],null);P.inv.push(it);log(`Half-buried in the ground: ${itemName(it)}!`,'good');return;}
  gainXp(5+L.lv[0]*2);log(U.pick(['You map the area carefully.','You find old campfire ashes and tracks leading nowhere.','The wind carries distant howls.','You sit on a rock and enjoy the view for a moment.','You find a weathered signpost with half the names scratched out.']));
}
function examine(i){const P=S.P,L=LOCS[P.loc];const f=(L.feat||[])[i];if(!f)return;spend(15);const key=P.loc+':'+i;const first=!P.examined[key];P.examined[key]=1;
  const texts={0:'Look closely and you can see it has been here for centuries.',1:'Scratched into the surface are names, dates, and a crude map.',2:'You run your hand over it and feel a faint warmth.',3:'Something about it feels important.'};
  log(`${f}: ${texts[i%4]}`,'lore');
  if(first){gainXp(10+L.lv[0]*3);const lorePool={watchtower:'lore_aethermoor',aethermoor:'lore_sundering',hollow:'lore_hollow',spire:'lore_spire',summit:'lore_wyrm',mire:'lore_hydra',necropolis:'lore_vel',undervault:'lore_undervault',valeria:'lore_lionheart',pawhaven:'lore_unchaining',duskhaven:'lore_spideroracle',bloodrock:'lore_ashspirits',whisperwood:'lore_grubnak',ashen:'lore_dragonpacts',lothirien:'lore_concord',saltmere:'lore_saltmere',skyreach:'lore_monastery'};
    if(lorePool[P.loc]&&U.chance(0.6))unlockLore(lorePool[P.loc]);else if(U.chance(0.3)){const g=U.ri(5,20)*Math.max(1,L.lv[0]);P.gold+=g;log(`Tucked away inside, you find ${g} gold.`,'good');}}}
function searchTreasure(){const P=S.P,L=LOCS[P.loc];spend(90);if(treasureDig())return;const luck=stats(P).attr.luck;
  if(U.chance(0.12)){const dmg=Math.round(stats(P).mhp*0.12);P.hp=Math.max(1,P.hp-dmg);log(`A hidden trap springs! You take ${dmg} damage.`,'bad');return;}
  if(U.chance(0.25+luck*0.006+(P.race==='halfling'?0.1:0))){const lv=L.lv[1];const g=U.ri(10,30)*lv;P.gold+=g;log(`You uncover a buried chest with ${g} gold!`,'good');
    if(U.chance(0.4)){const it=randomGear(lv,P.cls,U.chance(0.15)?3:U.chance(0.5)?2:1);P.inv.push(it);log(`Inside: ${itemName(it)} (${RARITY[it.r].n})!`,'epic');}
    if(P.loc==='dunes'&&S.flags.meteor&&S.time-S.flags.meteor<2880){invAdd(P,'aether_shard',1);log('You find an Aether Shard from the fallen meteor!','epic');}return;}
  if(L.mon.length&&U.chance(0.3)){log('Your digging attracts attention...','bad');startEncounter(P.loc);return;}
  log('You search for a long time but find nothing.');}
function gather(k,m){const P=S.P;spend(45);const lv=mLv(P,m);const yieldBonus=(P.race==='dwarf'&&m==='mining'?0.2:0)+(P.race==='woodelf'&&m==='herbalism'?0.2:0);
  let q=1+Math.floor(lv/20)+(U.chance(0.3+yieldBonus)?1:0);invAdd(P,k,q);P.stats.gathered+=q;gainMastery(m,6+q);log(`You gather ${q} ${ITEMS[k].n}.`,'good');
  checkFactionChain('gather');
  for(const qu of P.quests)if((qu.type==='gather'||qu.type==='request')&&qu.item===k&&!qu.done){qu.prog=Math.min(qu.qty,invCount(P,k));if(qu.prog>=qu.qty){qu.done=true;log(`Quest ready: ${qu.n} (return to ${LOCS[qu.giver].n})`,'good');}}
  if(LOCS[P.loc].mon.length&&U.chance(0.12)){log('A creature interrupts your work!','bad');startEncounter(P.loc);}}
function restInn(){const P=S.P;const cost=10+P.level*2;if(P.gold<cost){log(`A room costs ${cost}g. You can't afford it.`,'bad');return;}P.gold-=cost;spend(8*60);const st=stats(P);P.hp=st.mhp;P.mp=st.mmp;P.sp=st.msp;P.home=P.loc;P.fx.wellfed=0;
  log(`You sleep soundly at the inn (${cost}g). Fully restored. ${LOCS[P.loc].n} is now your home point.`,'good');}
function camp(){const P=S.P;spend(6*60);const st=stats(P);P.hp=Math.min(st.mhp,P.hp+st.mhp*0.6);P.mp=Math.min(st.mmp,P.mp+st.mmp*0.6);P.sp=st.msp;log('You make camp and rest for a few hours.');
  if(LOCS[P.loc].mon.length&&U.chance(0.25)){log('You wake to snarls in the dark!','bad');startEncounter(P.loc,{ambush:true});}}
function hearRumors(){const P=S.P;if(P.gold<5){log('You need 5 gold for a round of drinks.','bad');return;}P.gold-=5;spend(30);const R=rumors(P.loc);log('You buy a round and listen to the regulars:','lore');for(const r of R)log(`“${r}”`,'lore');
  for(const h of ['hollow','cove','skyreach'])if(R.some(r=>r.includes(h==='hollow'?'west of Moonfall':h==='cove'?'Silk-Eye':'monastery')))P.flags['rumor_'+h]=1;}
function talkTownsfolk(name,role){const P=S.P;spend(10);const R=rumors(P.loc);
  const lines={innkeeper:['Rooms are clean and the ale is mostly water. What more do you want?','Adventurers come and go. Most come back.'],farmer:['Wolves got two sheep last night. If you\'re heading into the Greenmarch, keep an eye out.'],
    elder:['When I was young the Abandoned Mine still gave silver. Then the miners dug too deep.'],librarian:['Knowledge is the only treasure that grows when shared. Feel free to read.'],guard:['Keep your weapons sheathed inside the walls.','Bandits on the roads lately. Be careful.'],
    merchant:['Buy low, sell high. Everything else is details.','Prices go up and down with the wars. Pay attention.'],priest:['May the light guide your steps.','The temple heals all who ask.'],arena:['The Grand Tournament comes every seven days. Register at the arena when it opens.'],
    smith:['Bring me ore and I\'ll teach you something about steel.','Off-class gear works, but you\'ll fight clumsily in it until you train.'],mystic:['The dragons remember the pacts. So do their children.'],mentor:['The higher paths are earned, not given. Show me your mastery.'],
    barkeep:['Ale\'s two coppers. Gossip\'s free if you buy the ale.'],courier:['I carry letters for every city. Real adventurers can send each other parcels through me.'],smuggler:['You didn\'t see this place. Understood?'],elder2:[]};
  log(`${name}: “${U.pick(lines[role]||['Good day, traveler.'])}”`,'social');if(U.chance(0.6))log(`${name}: “Also: ${R[0]}”`,'lore');
